
#Gradle
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx2048M"
org.gradle.caching=true
#org.gradle.configuration-cache=true

#Kotlin
kotlin.code.style=official
#kotlin.js.compiler=ir
# K2 compilator
#kotlin.experimental.tryK2=true
#android.lint.useK2Uast=true
android.suppressUnsupportedOptionWarnings=android.suppressUnsupportedOptionWarnings,android.lint.useK2Uast
#kotlin.mpp.androidGradlePluginCompatibility.nowarn=true
#Compose
org.jetbrains.compose.experimental.uikit.enabled=true
org.jetbrains.compose.experimental.jscanvas.enabled=true
#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
#Native
kotlin.native.ignoreDisabledTargets=true
kotlin.mpp.applyDefaultHierarchyTemplate=false
#AGP 9: библиотечные constraints выключены (рекомендация sync)
android.dependency.useConstraints=false
#AGP 9 совмещает Kotlin в себя; для org.jetbrains.kotlin.multiplatform
#обязательно выключить встроенный Kotlin (иначе конфликт плагинов)
android.builtInKotlin=false
#KGP 2.2 работает с AGP 9 только в legacy-DSL (BaseExtension);
#новый DSL требует KGP 2.3+
android.newDsl=false
#Mac
#org.jetbrains.compose.experimental.macos.enabled=true
